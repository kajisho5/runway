# runway に登録済みの Secrets を repos.txt の全リポへコピーする（PC 作業不要）。
# 事前に runway の Secrets に6件＋SYNC_TOKEN を登録しておく。README の「Secrets を配る」参照。
name: sync-secrets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [repos.txt]

permissions:
  contents: read

concurrency:
  group: sync-secrets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy secrets to target repos
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SELF_REPO: ${{ github.repository }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
        run: |
          set -euo pipefail
          KEYS=(ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 APPLE_TEAM_ID MATCH_GIT_TOKEN)

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::runway の Secrets に SYNC_TOKEN が無いので配布をスキップ（README の「初回だけ」参照）"
            echo "### SYNC_TOKEN 未登録のため配布をスキップ" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          missing=0
          for k in "${KEYS[@]}"; do
            if [ -z "${!k:-}" ]; then
              echo "::error::runway の Secrets に $k が無い"; missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          repos=()
          while IFS= read -r r || [ -n "$r" ]; do
            r="${r%$'\r'}"; r="${r%%#*}"; r="${r//[[:space:]]/}"
            [ -z "$r" ] && continue
            [ "$r" = "$SELF_REPO" ] && continue
            repos+=("$r")
          done < repos.txt

          if [ "${#repos[@]}" -eq 0 ]; then
            echo "::warning::repos.txt に配布先が無い（runway 自身は除外される）"
            exit 0
          fi

          failed=0
          {
            echo "### Secrets 配布結果"
            echo ""
            echo "| リポ | 結果 |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for repo in "${repos[@]}"; do
            echo "== $repo"
            ok=1
            for k in "${KEYS[@]}"; do
              [ -n "${!k:-}" ] || continue
              if ! printf '%s' "${!k}" | gh secret set "$k" --repo "$repo"; then
                echo "::error::$repo の $k 設定に失敗（SYNC_TOKEN の対象リポと Secrets 権限を確認）"
                ok=0
                failed=1
                break
              fi
            done
            if [ "$ok" -eq 1 ]; then
              echo "| $repo | OK（${#KEYS[@]}件） |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $repo | 失敗 |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit "$failed"
